# =====================================================================
#  SmartQueue configuration  (ORACLE DATABASE edition)
#  Edit the database user / password / service name to match YOUR Oracle installation.
# =====================================================================

# ---- Oracle Database --------------------------------------------------
db.host=DESKTOP-8DI8SFF
db.port=1521

# Service name of the database you connect to:
#   Oracle XE 18c / 21c (pluggable DB) ..... XEPDB1      <- default
#   Oracle Database 23ai Free .............. FREEPDB1
#   Oracle XE 11g / non-multitenant ........ XE
#   Oracle 19c (pluggable DB) .............. usually ORCLPDB1 (ask your DBA / check lsnrctl status)
db.service=FREEPDB1

# Old-style SID instead of a service name (only if you really need it - leave commented otherwise)
# db.sid=XE

# The schema (user) that will own the SmartQueue tables.
# Create it once with database/oracle-setup.sql (default password there = smartqueue123).
db.user=smartqueue
db.password=smartqueue123

# Optional: a complete JDBC URL (overrides host / port / service / sid above)
# db.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1

db.pool-size=12

# ---- Web server -----------------------------------------------------
server.port=8080
# 0.0.0.0 = reachable from other devices on your Wi-Fi (phones). Use 127.0.0.1 for this computer only.
server.host=0.0.0.0
server.threads=32

# ---- Application ----------------------------------------------------
# Real production mode: only real user accounts and real queue tokens are used.
app.seed-demo-data=false
# Time zone used for tokens, reports and "today". Default: the computer's time zone.
# app.timezone=Asia/Kolkata
